<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HospiOne — Voice-First Hospital Operations AI Command Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: '#FAFAF8',
            foreground: '#1A1A1A',
            muted: '#F5F3F0',
            'muted-foreground': '#6B6B6B',
            accent: '#B8860B',
            'accent-secondary': '#D4A84B',
            'accent-foreground': '#FFFFFF',
            border: '#E8E4DF',
            'border-hover': '#D5CFC7',
            card: '#FFFFFF',
            ring: '#B8860B'
          },
          fontFamily: {
            display: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['"Source Sans 3"', 'system-ui', 'sans-serif'],
            mono: ['"IBM Plex Mono"', 'monospace']
          },
          boxShadow: {
            sm: '0 1px 2px rgba(26, 26, 26, 0.04)',
            md: '0 4px 12px rgba(26, 26, 26, 0.06)',
            lg: '0 8px 24px rgba(26, 26, 26, 0.08)',
            accent: '0 4px 14px rgba(184, 134, 11, 0.22)'
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');

    :root {
      --background: #FAFAF8;
      --foreground: #1A1A1A;
      --muted: #F5F3F0;
      --muted-foreground: #6B6B6B;
      --accent: #B8860B;
      --accent-secondary: #D4A84B;
      --accent-foreground: #FFFFFF;
      --accent-muted: rgba(184, 134, 11, 0.06);
      --border: #E8E4DF;
      --border-hover: #D5CFC7;
      --card: #FFFFFF;
      --ring: #B8860B;
    }

    ::selection {
      background-color: rgba(184, 134, 11, 0.18);
      color: #1A1A1A;
    }

    body {
      font-family: "Source Sans 3", system-ui, sans-serif;
      background-color: var(--background);
      color: var(--foreground);
      font-size: 1rem;
      line-height: 1.6;
      letter-spacing: 0.01em;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, .font-display {
      font-family: "Playfair Display", Georgia, serif;
    }

    pre, code, .font-mono {
      font-family: "IBM Plex Mono", monospace;
    }

    .small-caps {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .paper-texture {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='paper'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23paper)' opacity='0.025'/%3E%3C/svg%3E");
    }

    .ambient-gold-glow {
      background: radial-gradient(
        circle at 50% 25%,
        rgba(184, 134, 11, 0.06) 0%,
        rgba(212, 168, 75, 0.02) 45%,
        transparent 75%
      );
    }

    .voice-wave span {
      display: inline-block;
      width: 2.5px;
      height: 14px;
      margin: 0 1.5px;
      background: var(--accent);
      border-radius: 1px;
      animation: serif-wave 0.9s infinite ease-in-out;
    }
    .voice-wave span:nth-child(2) { animation-delay: 0.15s; }
    .voice-wave span:nth-child(3) { animation-delay: 0.3s; }
    .voice-wave span:nth-child(4) { animation-delay: 0.45s; }
    @keyframes serif-wave {
      0%, 100% { transform: scaleY(0.35); opacity: 0.55; }
      50% { transform: scaleY(1.25); opacity: 1; }
    }

    .serif-focus:focus-visible {
      outline: none !important;
      box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--ring) !important;
    }

    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #F5F3F0;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #D5CFC7;
      border-radius: 3px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: #B8860B;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col paper-texture">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // =========================================================================
    // REUSABLE SERIF DESIGN SYSTEM PRIMITIVES
    // =========================================================================

    function SectionLabel({ children, className = "mb-4" }) {
      return (
        <div className={`flex items-center gap-3 ${className}`}>
          <span className="h-px flex-1 bg-[#E8E4DF]" aria-hidden="true" />
          <span className="small-caps text-[#B8860B] shrink-0">
            {children}
          </span>
          <span className="h-px flex-1 bg-[#E8E4DF]" aria-hidden="true" />
        </div>
      );
    }

    function SerifButton({
      variant = "primary",
      size = "md",
      active = false,
      disabled = false,
      onClick,
      children,
      className = "",
      title = "",
      type = "button"
    }) {
      const sizeClasses = {
        xs: "min-h-[34px] px-3 py-1 text-xs",
        sm: "min-h-[40px] px-3.5 py-1.5 text-xs",
        md: "min-h-[44px] px-5 py-2 text-sm",
        lg: "min-h-[48px] px-6 py-2.5 text-base"
      };

      const variantClasses = {
        primary:
          "bg-[#B8860B] text-white font-semibold tracking-[0.02em] rounded-md shadow-sm hover:bg-[#D4A84B] hover:shadow-accent hover:-translate-y-0.5 active:translate-y-0",
        dark:
          "bg-[#1A1A1A] text-white font-semibold tracking-[0.02em] rounded-md shadow-sm hover:bg-[#333333] hover:-translate-y-0.5 active:translate-y-0",
        secondary: active
          ? "bg-[#F5F3F0] border border-[#B8860B] text-[#B8860B] font-semibold rounded-md shadow-sm"
          : "bg-transparent border border-[#1A1A1A] text-[#1A1A1A] font-medium rounded-md hover:bg-[#F5F3F0] hover:border-[#B8860B] hover:text-[#B8860B]",
        outline: active
          ? "bg-[rgba(184,134,11,0.1)] border border-[#B8860B] text-[#B8860B] font-semibold rounded-md"
          : "bg-white border border-[#E8E4DF] text-[#1A1A1A] font-medium rounded-md shadow-sm hover:bg-[#F5F3F0]/70 hover:border-[#B8860B] hover:text-[#B8860B]",
        ghost:
          "bg-transparent text-[#6B6B6B] hover:text-[#1A1A1A] hover:underline decoration-[#B8860B] underline-offset-4 px-2"
      };

      return (
        <button
          type={type}
          onClick={onClick}
          disabled={disabled}
          title={title}
          className={`serif-focus touch-manipulation inline-flex items-center justify-center transition-all duration-200 ease-out select-none ${
            sizeClasses[size] || sizeClasses.md
          } ${variantClasses[variant] || variantClasses.primary} ${
            disabled ? "opacity-50 cursor-not-allowed pointer-events-none" : "cursor-pointer"
          } ${className}`}>
          {children}
        </button>
      );
    }

    function SerifCard({
      accentTop = false,
      featured = false,
      elevated = false,
      label = null,
      title = null,
      subtitle = null,
      headerRight = null,
      className = "",
      bodyClassName = "p-5 sm:p-6",
      children
    }) {
      const surfaceClass = featured
        ? "bg-[rgba(184,134,11,0.06)] border-2 border-[#B8860B] shadow-md"
        : accentTop
        ? `bg-white border border-[#E8E4DF] border-t-2 border-t-[#B8860B] ${elevated ? "shadow-md" : "shadow-sm"}`
        : `bg-white border border-[#E8E4DF] ${elevated ? "shadow-md" : "shadow-sm"}`;

      return (
        <section className={`rounded-lg flex flex-col ${surfaceClass} ${className}`}>
          {(label || title || headerRight) && (
            <header className="px-5 sm:px-6 py-4 border-b border-[#E8E4DF] flex flex-wrap items-center justify-between gap-3 bg-[#FAFAF8]/60">
              <div className="min-w-0">
                {label && (
                  <span className="small-caps text-[#B8860B] block mb-0.5">
                    {label}
                  </span>
                )}
                {title && (
                  <h2 className="font-display text-lg sm:text-xl font-semibold text-[#1A1A1A] leading-snug truncate">
                    {title}
                  </h2>
                )}
                {subtitle && (
                  <p className="text-xs text-[#6B6B6B] mt-0.5">{subtitle}</p>
                )}
              </div>
              {headerRight && <div className="shrink-0 flex items-center gap-2">{headerRight}</div>}
            </header>
          )}
          <div className={`flex-1 ${bodyClassName}`}>
            {children}
          </div>
        </section>
      );
    }

    function GoldPullQuote({ quote, attribution = "HospiOne Spoken Response", onReplay = null, compact = false }) {
      return (
        <blockquote className={`relative bg-[#FAFAF8] border border-[#E8E4DF] border-l-4 border-l-[#B8860B] rounded-r-lg ${compact ? "p-4" : "p-5"} shadow-sm`}>
          <div className="space-y-2">
            <div className="flex items-center justify-between gap-2">
              <span className="small-caps text-[#B8860B] flex items-center gap-1.5">
                <i className="fa-solid fa-volume-high text-[11px]"></i>
                <span>{attribution}</span>
              </span>
              {onReplay && (
                <button
                  onClick={onReplay}
                  className="serif-focus text-xs font-mono text-[#6B6B6B] hover:text-[#B8860B] flex items-center gap-1 px-2 py-0.5 rounded border border-[#E8E4DF] bg-white">
                  <i className="fa-solid fa-rotate-right text-[10px]"></i>
                  <span>Replay</span>
                </button>
              )}
            </div>
            <p className={`font-display italic ${compact ? "text-base" : "text-lg"} text-[#1A1A1A] leading-relaxed`}>
              &ldquo;{quote}&rdquo;
            </p>
          </div>
        </blockquote>
      );
    }

    // =========================================================================
    // WEB AUDIO SYNTHESIZER & SPEECH HELPERS
    // =========================================================================
    const audioCtxRef = { current: null };

    function getAudioContext() {
      if (!audioCtxRef.current) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) audioCtxRef.current = new AudioCtx();
      }
      if (audioCtxRef.current && audioCtxRef.current.state === 'suspended') {
        audioCtxRef.current.resume();
      }
      return audioCtxRef.current;
    }

    function playChime(type) {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'listen') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.22);
        } else if (type === 'ack') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(659, now + 0.15);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === 'approval') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(660, now);
          osc.frequency.exponentialRampToValueAtTime(990, now + 0.2);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        }
      } catch (e) {
        console.warn("Audio chime error:", e);
      }
    }

    function renderInlineMd(line, keyBase) {
      const parts = String(line).split(/(\*\*[^*]+\*\*|`[^`]+`)/g);
      return parts.map((p, i) => {
        if (/^\*\*[^*]+\*\*$/.test(p)) return <strong key={keyBase + "-" + i}>{p.slice(2, -2)}</strong>;
        if (/^`[^`]+`$/.test(p)) return <code key={keyBase + "-" + i} className="font-mono text-[11px] bg-[#F5F3F0] px-1 rounded">{p.slice(1, -1)}</code>;
        return <React.Fragment key={keyBase + "-" + i}>{p.replace(/\*(.+?)\*/g, "$1")}</React.Fragment>;
      });
    }

    function renderMd(text) {
      if (typeof text !== "string") return null;
      return text.split("\n").map((raw, idx) => {
        const line = raw.trimEnd();
        if (!line.trim()) return <div key={idx} className="h-2" />;
        const h = line.match(/^#{1,6}\s+(.*)$/);
        if (h) return <div key={idx} className="font-display font-bold text-base text-[#1A1A1A] mb-1">{renderInlineMd(h[1], idx)}</div>;
        const q = line.match(/^>\s?(.*)$/);
        if (q) return <div key={idx} className="border-l-2 border-[#B8860B] pl-2 text-[#6B6B6B] italic">{renderInlineMd(q[1], idx)}</div>;
        const b = line.match(/^\s*[-*]\s+(.*)$/);
        if (b) return <div key={idx} className="flex gap-2 pl-1"><span className="text-[#B8860B]">•</span><span>{renderInlineMd(b[1], idx)}</span></div>;
        return <div key={idx}>{renderInlineMd(line, idx)}</div>;
      });
    }

    function getInstantVocalAck(text) {
      const lower = text.toLowerCase();
      if (lower.includes("antibiotic") || lower.includes("dosage") || lower.includes("diagnos") || lower.includes("fever") || lower.includes("treatment")) {
        return "Hospital Scope Guard: HospiOne is strictly non-clinical and cannot provide medical diagnosis or medication dosage advice.";
      }
      if (lower.includes("glove") || lower.includes("inventory") || lower.includes("stock") || lower.includes("supply") || lower.includes("requisition")) {
        return "Checking medical supply catalog and preparing your inventory requisition for approval.";
      }
      if (lower.includes("call") || lower.includes("biomed") || lower.includes("engineering") || lower.includes("maintenance")) {
        return "Locating department directory extension and preparing CALL-E voice dispatch.";
      }
      if (lower.includes("task") || lower.includes("schedule") || lower.includes("pending")) {
        return "Accessing today's hospital operational tasks and duty roster.";
      }
      if (lower.includes("follow") || lower.includes("patient") || lower.includes("discharge")) {
        return "Retrieving today's administrative patient follow-ups and care coordination list.";
      }
      if (lower.includes("approve") || lower.includes("yes") || lower.includes("allow") || lower.includes("confirm") || lower.includes("go ahead")) {
        return "Approved! Executing hospital operational workflow now.";
      }
      if (lower.includes("deny") || lower.includes("reject") || lower.includes("cancel") || lower.includes("no")) {
        return "Cancelled. No operational changes were made.";
      }
      return "HospiOne on it. Processing your operational hospital request now.";
    }

    // =========================================================================
    // MAIN HOSPIONE APPLICATION
    // =========================================================================
    function App() {
      // Core Hospital Data States
      const [summary, setSummary] = useState(null);
      const [tasks, setTasks] = useState([]);
      const [calls, setCalls] = useState([]);
      const [inventoryItems, setInventoryItems] = useState([]);
      const [inventoryRequests, setInventoryRequests] = useState([]);
      const [followups, setFollowups] = useState([]);
      const [devices, setDevices] = useState([]);
      const [departments, setDepartments] = useState([]);
      const [auditLogs, setAuditLogs] = useState([]);

      // User Perspective / Role Switcher
      const [userRole, setUserRole] = useState("Doctor");

      // Agent & Voice States
      const [prompt, setPrompt] = useState("Create an inventory request for 20 boxes of examination gloves.");
      const [events, setEvents] = useState([]);
      const [isStreaming, setIsStreaming] = useState(false);
      const [sessionStatus, setSessionStatus] = useState("IDLE");
      const [pendingApproval, setPendingApproval] = useState(null);
      const [activeTaskId, setActiveTaskId] = useState(null);
      const [isListening, setIsListening] = useState(false);
      const [voiceStatusText, setVoiceStatusText] = useState("");
      const [voiceEnabled, setVoiceEnabled] = useState(true);
      const [isSpeaking, setIsSpeaking] = useState(false);
      const [currentSpokenLine, setCurrentSpokenLine] = useState("");
      const [latestResponse, setLatestResponse] = useState(null);
      const [activeAgentStep, setActiveAgentStep] = useState("");
      const [voiceHistory, setVoiceHistory] = useState([]);
      const [activeTab, setActiveTab] = useState("overview");
      const [voiceModeOpen, setVoiceModeOpen] = useState(false);
      const [handsFreeMode, setHandsFreeMode] = useState(true);
      const [micLevel, setMicLevel] = useState(0);
      const [preferredLanguage, setPreferredLanguage] = useState("auto");
      const [detectedLanguage, setDetectedLanguage] = useState("en-IN");
      const [calleStatusMsg, setCalleStatusMsg] = useState("");

      // Filter States
      const [taskFilterDept, setTaskFilterDept] = useState("all");
      const [taskFilterPriority, setTaskFilterPriority] = useState("all");
      const [taskFilterStatus, setTaskFilterStatus] = useState("all");

      // Modal Dialog States
      const [callModalOpen, setCallModalOpen] = useState(false);
      const [selectedCallDept, setSelectedCallDept] = useState("");
      const [customCallPhone, setCustomCallPhone] = useState("+918496074290");
      const [callPurpose, setCallPurpose] = useState("Inquire regarding pending maintenance request");
      const [newTaskModalOpen, setNewTaskModalOpen] = useState(false);
      const [newTaskData, setNewTaskData] = useState({ title: "", department: "Inpatient Ward 3", priority: "Medium", assigned_to: "Staff Nurse Priya", notes: "" });
      const [newReqModalOpen, setNewReqModalOpen] = useState(false);
      const [newReqData, setNewReqData] = useState({ item_name: "Examination Gloves (Nitrile Powder-Free)", quantity: 20, unit: "boxes", department: "Inpatient Ward 3", priority: "Standard", rationale: "Ward 3 shift restock" });

      // Hardware Simulator
      const [esp32SimData, setEsp32SimData] = useState({ last_cmd: "Ready", agent_msg: "HospiOne ready for voice commands" });

      // Refs
      const eventEndRef = useRef(null);
      const audioElementRef = useRef(null);
      const lastVoiceRef = useRef("");
      const recognitionRef = useRef(null);
      const mediaRecorderRef = useRef(null);
      const audioChunksRef = useRef([]);
      const voiceEnabledRef = useRef(true);
      const sessionStatusRef = useRef("IDLE");
      const activeTaskIdRef = useRef(null);
      const handsFreeModeRef = useRef(true);
      const isSpeakingRef = useRef(false);
      const isListeningRef = useRef(false);
      const voiceModeOpenRef = useRef(false);
      const hasGreetedRef = useRef(false);
      const preferredLanguageRef = useRef("auto");
      const detectedLanguageRef = useRef("en-IN");

      useEffect(() => { voiceEnabledRef.current = voiceEnabled; }, [voiceEnabled]);
      useEffect(() => { sessionStatusRef.current = sessionStatus; }, [sessionStatus]);
      useEffect(() => { activeTaskIdRef.current = activeTaskId; }, [activeTaskId]);
      useEffect(() => { handsFreeModeRef.current = handsFreeMode; }, [handsFreeMode]);
      useEffect(() => { isSpeakingRef.current = isSpeaking; }, [isSpeaking]);
      useEffect(() => { isListeningRef.current = isListening; }, [isListening]);
      useEffect(() => { voiceModeOpenRef.current = voiceModeOpen; }, [voiceModeOpen]);
      useEffect(() => { preferredLanguageRef.current = preferredLanguage; }, [preferredLanguage]);
      useEffect(() => { detectedLanguageRef.current = detectedLanguage; }, [detectedLanguage]);

      const getEffectiveLanguage = (overrideLang = null) => {
        if (overrideLang && overrideLang !== "auto") return overrideLang;
        if (preferredLanguageRef.current && preferredLanguageRef.current !== "auto") {
          return preferredLanguageRef.current;
        }
        return detectedLanguageRef.current || "en-IN";
      };

      // Audio engine unlock
      const unlockAudioEngine = () => {
        try {
          const ctx = getAudioContext();
          if (ctx && ctx.state === "suspended") {
            ctx.resume();
          }
        } catch (e) {
          console.warn("[Audio Unlock]", e);
        }
      };

      useEffect(() => {
        fetchAllHospitalData();
        const handleAnyGesture = () => unlockAudioEngine();
        window.addEventListener("click", handleAnyGesture, { passive: true });
        window.addEventListener("keydown", handleAnyGesture, { passive: true });
        return () => {
          window.removeEventListener("click", handleAnyGesture);
          window.removeEventListener("keydown", handleAnyGesture);
        };
      }, []);

      useEffect(() => {
        if (eventEndRef.current) {
          eventEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [events]);

      const fetchAllHospitalData = async () => {
        try {
          const [sumRes, tasksRes, callsRes, invRes, reqsRes, followRes, devRes, deptRes, auditRes] = await Promise.all([
            fetch("/api/hospital/summary").then(r => r.json()).catch(() => null),
            fetch("/api/hospital/tasks").then(r => r.json()).catch(() => ({ tasks: [] })),
            fetch("/api/hospital/calls").then(r => r.json()).catch(() => ({ calls: [] })),
            fetch("/api/hospital/inventory").then(r => r.json()).catch(() => ({ items: [] })),
            fetch("/api/hospital/inventory/requests").then(r => r.json()).catch(() => ({ requests: [] })),
            fetch("/api/hospital/followups").then(r => r.json()).catch(() => ({ followups: [] })),
            fetch("/api/hospital/devices").then(r => r.json()).catch(() => ({ devices: [] })),
            fetch("/api/hospital/departments").then(r => r.json()).catch(() => ({ departments: [] })),
            fetch("/api/audit/biz_001").then(r => r.json()).catch(() => ({ events: [] }))
          ]);

          if (sumRes) setSummary(sumRes);
          if (tasksRes) setTasks(tasksRes.tasks || []);
          if (callsRes) setCalls(callsRes.calls || []);
          if (invRes) setInventoryItems(invRes.items || []);
          if (reqsRes) setInventoryRequests(reqsRes.requests || []);
          if (followRes) setFollowups(followRes.followups || []);
          if (devRes) setDevices(devRes.devices || []);
          if (deptRes) setDepartments(deptRes.departments || []);
          if (auditRes) setAuditLogs(auditRes.events || []);
        } catch (e) {
          console.error("Error fetching hospital data:", e);
        }
      };

      // Action Handlers
      const handleApproveInventoryRequest = async (id) => {
        try {
          await fetch(`/api/hospital/inventory/requests/${id}/approve`, { method: "POST" });
          playChime("ack");
          fetchAllHospitalData();
        } catch (e) {
          console.error(e);
        }
      };

      const handleRejectInventoryRequest = async (id) => {
        try {
          await fetch(`/api/hospital/inventory/requests/${id}/reject`, { method: "POST" });
          fetchAllHospitalData();
        } catch (e) {
          console.error(e);
        }
      };

      const handleToggleTaskStatus = async (taskId, currentStatus) => {
        const nextStatus = currentStatus === "Pending" ? "In Progress" : currentStatus === "In Progress" ? "Completed" : "Pending";
        try {
          await fetch(`/api/hospital/tasks/${taskId}/status`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ status: nextStatus })
          });
          playChime("ack");
          fetchAllHospitalData();
        } catch (e) {
          console.error(e);
        }
      };

      const handleContactFollowup = async (followupId) => {
        try {
          await fetch(`/api/hospital/followups/${followupId}/contact`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contact_status: "Contacted",
              administrative_status: "Verified",
              notes: `Verified by ${userRole} via HospiOne console at ${new Date().toLocaleTimeString()}`
            })
          });
          playChime("ack");
          fetchAllHospitalData();
        } catch (e) {
          console.error(e);
        }
      };

      const handleInitiateDirectCall = async (deptName, phone, purpose) => {
        setCalleStatusMsg(`📞 Initiating CALL-E voice call to ${deptName} (${phone || "Ext 214"})...`);
        try {
          const res = await fetch("/api/hospital/calls/initiate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              department: deptName,
              phone: phone || "+918496074290",
              purpose: purpose || "Urgent operational coordination",
              initiated_by: `${userRole} (HospiOne Console)`
            })
          });
          const data = await res.json();
          setCalleStatusMsg(`📞 Call connected via CALL-E (${deptName}): ${data.status || "DISPATCHED"}`);
          playChime("ack");
          fetchAllHospitalData();
          setTimeout(() => setCalleStatusMsg(""), 7000);
        } catch (e) {
          setCalleStatusMsg(`❌ Call failed: ${e.message}`);
          setTimeout(() => setCalleStatusMsg(""), 7000);
        }
      };

      const handleSimulateDevicePing = async (dev) => {
        try {
          const res = await fetch("/api/esp32/command", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ command: "ping", business_id: "biz_001" })
          });
          const data = await res.json();
          setEsp32SimData(data);
          playChime("ack");
          fetchAllHospitalData();
        } catch (e) {
          console.error(e);
        }
      };

      // Speech Synthesis & Queue
      const speechQueueRef = useRef([]);
      const isSpeakingInternalRef = useRef(false);

      const fallbackSpeechSynthesis = (cleanText, lang = "en-IN") => {
        if (!('speechSynthesis' in window)) {
          setIsSpeaking(false);
          isSpeakingRef.current = false;
          isSpeakingInternalRef.current = false;
          return;
        }
        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(cleanText);
          utterance.lang = lang === "kn-IN" ? "kn-IN" : lang === "hi-IN" ? "hi-IN" : "en-IN";
          utterance.rate = 1.0;
          utterance.pitch = 1.0;
          utterance.onend = () => {
            setIsSpeaking(false);
            isSpeakingRef.current = false;
            isSpeakingInternalRef.current = false;
            if (handsFreeModeRef.current && voiceModeOpenRef.current && !isListeningRef.current) {
              startListeningSession();
            }
          };
          utterance.onerror = () => {
            setIsSpeaking(false);
            isSpeakingRef.current = false;
            isSpeakingInternalRef.current = false;
          };
          window.speechSynthesis.speak(utterance);
        } catch (e) {
          console.warn("[SpeechSynthesis Exception]", e);
          setIsSpeaking(false);
          isSpeakingRef.current = false;
          isSpeakingInternalRef.current = false;
        }
      };

      const speakImmediate = (text, lang = null) => {
        if (!voiceEnabledRef.current || !text) return;
        const targetLang = lang || getEffectiveLanguage();
        const cleanText = text.replace(/[*#`_~]/g, "").trim();
        if (!cleanText) return;

        stopSpeaking();
        setCurrentSpokenLine(cleanText);
        setIsSpeaking(true);
        isSpeakingRef.current = true;
        isSpeakingInternalRef.current = true;

        try {
          if (!audioElementRef.current) {
            audioElementRef.current = new Audio();
          }
          const audio = audioElementRef.current;
          audio.pause();
          audio.currentTime = 0;

          const ttsUrl = `/api/tts?text=${encodeURIComponent(cleanText.slice(0, 500))}&lang=${encodeURIComponent(targetLang)}`;
          audio.src = ttsUrl;

          audio.onended = () => {
            setIsSpeaking(false);
            isSpeakingRef.current = false;
            isSpeakingInternalRef.current = false;
            if (handsFreeModeRef.current && voiceModeOpenRef.current && !isListeningRef.current) {
              startListeningSession();
            }
          };

          audio.onerror = () => {
            console.warn("[Neural TTS Error, falling back to Web Speech API]");
            fallbackSpeechSynthesis(cleanText, targetLang);
          };

          const playPromise = audio.play();
          if (playPromise !== undefined) {
            playPromise.catch((err) => {
              console.warn("[Neural Audio Autoplay Blocked, attempting fallback]", err);
              fallbackSpeechSynthesis(cleanText, targetLang);
            });
          }
        } catch (e) {
          console.warn("[Audio Playback Exception]", e);
          fallbackSpeechSynthesis(cleanText, targetLang);
        }
      };

      const stopSpeaking = () => {
        try {
          if (audioElementRef.current) {
            audioElementRef.current.pause();
            audioElementRef.current.currentTime = 0;
          }
        } catch (e) {}
        if ('speechSynthesis' in window) {
          try { window.speechSynthesis.cancel(); } catch (e) {}
        }
        setIsSpeaking(false);
        isSpeakingRef.current = false;
        isSpeakingInternalRef.current = false;
      };

      // Voice recognition handlers
      const handleVoiceToggle = () => {
        if (isListening) {
          finishAndSendVoice();
        } else {
          startListeningSession();
        }
      };

      const startListeningSession = () => {
        stopSpeaking();
        setIsListening(true);
        isListeningRef.current = true;
        setVoiceStatusText("Listening for hospital command...");
        playChime("listen");

        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRec) {
          if (recognitionRef.current) {
            try { recognitionRef.current.abort(); } catch (e) {}
          }
          const rec = new SpeechRec();
          rec.continuous = false;
          rec.interimResults = true;
          const effLang = getEffectiveLanguage();
          rec.lang = effLang === "kn-IN" ? "kn-IN" : effLang === "hi-IN" ? "hi-IN" : "en-IN";

          rec.onresult = (evt) => {
            const transcript = Array.from(evt.results)
              .map(r => r[0].transcript)
              .join("");
            setVoiceStatusText(`Heard: "${transcript}"`);
            if (evt.results[0].isFinal) {
              setPrompt(transcript);
              finishAndSendVoice(transcript);
            }
          };

          rec.onerror = (err) => {
            console.warn("Speech recognition error:", err);
            setIsListening(false);
            isListeningRef.current = false;
            setVoiceStatusText("Mic idle. Click to speak.");
          };

          rec.onend = () => {
            setIsListening(false);
            isListeningRef.current = false;
          };

          recognitionRef.current = rec;
          try {
            rec.start();
          } catch (e) {
            console.warn("Could not start SpeechRecognition:", e);
          }
        }
      };

      const finishAndSendVoice = (explicitText = null) => {
        if (recognitionRef.current) {
          try { recognitionRef.current.stop(); } catch (e) {}
        }
        setIsListening(false);
        isListeningRef.current = false;
        const textToSend = explicitText || prompt;
        if (textToSend && textToSend.trim()) {
          handleExecute(textToSend.trim());
        }
      };

      // Execution Engine
      const handleExecute = async (overridePrompt = null) => {
        const queryText = overridePrompt || prompt;
        if (!queryText) return;

        unlockAudioEngine();
        setIsStreaming(true);
        setSessionStatus("RUNNING");
        setActiveAgentStep("Hospital Agent routing operational intent...");
        setLatestResponse(null);
        lastVoiceRef.current = "";
        playChime("ack");

        const instantAck = getInstantVocalAck(queryText);
        setCurrentSpokenLine(instantAck);

        const newTaskId = `task_${Date.now()}`;
        setActiveTaskId(newTaskId);
        activeTaskIdRef.current = newTaskId;

        setEvents([
          {
            type: "USER_INPUT",
            summary: `User (${userRole}): "${queryText}"`,
            created_at: new Date().toISOString()
          },
          {
            type: "AGENT_STEP",
            step: "ROUTING",
            summary: "HospiOne Intent Classifier verifying clinical scope guard and permissions...",
            created_at: new Date().toISOString()
          }
        ]);

        try {
          const createRes = await fetch("/api/tasks/create", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              prompt: queryText,
              business_id: "biz_001",
              language_code: getEffectiveLanguage()
            })
          });
          const createData = await createRes.json();
          const tid = createData.task_id || newTaskId;
          setActiveTaskId(tid);
          activeTaskIdRef.current = tid;

          const eventSource = new EventSource(`/api/tasks/${tid}/events?prompt=${encodeURIComponent(queryText)}&lang=${getEffectiveLanguage()}`);

          eventSource.onmessage = (event) => {
            try {
              const evt = JSON.parse(event.data);
              setEvents((prev) => [...prev, evt]);

              if (typeof evt.content === "string" && evt.content.trim()) {
                setLatestResponse({
                  content: evt.content,
                  voice_text: evt.voice_text || "",
                  type: evt.type,
                  timestamp: evt.created_at || new Date().toISOString()
                });
              }

              if (evt.agent_step) {
                setActiveAgentStep(evt.agent_step);
              }

              if (evt.voice_text && evt.voice_text !== lastVoiceRef.current) {
                lastVoiceRef.current = evt.voice_text;
                speakImmediate(evt.voice_text, evt.language_code || getEffectiveLanguage());
              }

              if (evt.type === "WAITING_APPROVAL" || evt.type === "tool.approval_required") {
                const toolCall = evt.tool_calls?.[0] || {};
                setSessionStatus("WAITING_APPROVAL");
                setPendingApproval({
                  action_id: toolCall.action_id || evt.action_id,
                  action_title: toolCall.action_title || evt.action_title || "Hospital Operation Approval Gate",
                  department: toolCall.department || evt.department || "Operations",
                  rationale: toolCall.rationale || evt.rationale || evt.summary || "Requires staff approval before execution."
                });
                playChime("approval");
              }

              if (evt.type === "turn.done" || evt.type === "COMPLETE") {
                setIsStreaming(false);
                const awaitingApproval = !!(evt.state?.required_actions && evt.state.required_actions.length);
                setSessionStatus(awaitingApproval ? "WAITING_APPROVAL" : "COMPLETED");
                setActiveAgentStep(awaitingApproval ? "Awaiting your approval." : "Execution complete.");

                const out = evt.state?.output;
                if (out && typeof out.content === "string" && out.content) {
                  setLatestResponse(prev => ({
                    content: out.content,
                    voice_text: out.voice_text || prev?.voice_text || "",
                    type: "turn.done",
                    timestamp: evt.created_at || new Date().toISOString()
                  }));
                }
                if (out?.voice_text && out.voice_text !== lastVoiceRef.current) {
                  lastVoiceRef.current = out.voice_text;
                  speakImmediate(out.voice_text, evt.language_code || getEffectiveLanguage());
                }

                eventSource.close();
                fetchAllHospitalData();
              }
            } catch (e) {
              console.error("Error parsing event stream:", e);
            }
          };

          eventSource.onerror = () => {
            setIsStreaming(false);
            eventSource.close();
            fetchAllHospitalData();
          };
        } catch (e) {
          console.error("Error executing task:", e);
          setIsStreaming(false);
          setSessionStatus("IDLE");
        }
      };

      const handleApproval = async (decision) => {
        if (!activeTaskId) return;
        setSessionStatus("RUNNING");
        setPendingApproval(null);

        try {
          await fetch(`/api/tasks/${activeTaskId}/approve`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ decision })
          });
          playChime("ack");
          speakImmediate(decision === "allow" ? "Approved! Executing hospital operational workflow now." : "Cancelled. No operational changes were made.");
          fetchAllHospitalData();
        } catch (e) {
          console.error("Error submitting approval decision:", e);
        }
      };

      // Header summary stats
      const pendingTasksCount = summary?.metrics?.pending_tasks ?? tasks.filter(t => t.status !== "Completed").length;
      const callsTodayCount = summary?.metrics?.calls_today ?? calls.length;
      const invReqsCount = summary?.metrics?.inventory_requests ?? inventoryRequests.filter(r => r.status === "Pending Approval").length;
      const followupsCount = summary?.metrics?.followups_due ?? followups.length;
      const devicesOnlineStr = summary?.metrics?.devices_online_str ?? "3 / 4";

      // Filtered Tasks
      const filteredTasks = tasks.filter(t => {
        if (taskFilterDept !== "all" && !t.department.toLowerCase().includes(taskFilterDept.toLowerCase())) return false;
        if (taskFilterPriority !== "all" && t.priority.toLowerCase() !== taskFilterPriority.toLowerCase()) return false;
        if (taskFilterStatus !== "all" && t.status.toLowerCase() !== taskFilterStatus.toLowerCase()) return false;
        return true;
      });

      return (
        <div className="min-h-screen flex flex-col">
          {/* =====================================================================
              1. HEADER: BRANDING, NON-CLINICAL BADGE, ROLE SWITCHER, VOICE CONTROLS
             ===================================================================== */}
          <header className="border-b border-[#E8E4DF] bg-white/90 backdrop-blur-sm sticky top-0 z-40 px-4 sm:px-6 py-3">
            <div className="max-w-[1440px] mx-auto flex flex-wrap items-center justify-between gap-4">
              
              {/* Brand & Tagline */}
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-lg bg-[#B8860B] text-white flex items-center justify-center font-display font-bold text-xl shadow-accent">
                  H
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <h1 className="font-display text-xl font-bold text-[#1A1A1A] tracking-tight">
                      HospiOne
                    </h1>
                    <span className="small-caps px-2 py-0.5 rounded bg-[rgba(184,134,11,0.1)] text-[#B8860B] border border-[#B8860B]/30">
                      Operations OS
                    </span>
                    <span className="flex items-center gap-1 text-[11px] font-mono text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">
                      <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                      AI Agent Online
                    </span>
                    <span className="hidden sm:inline-block text-[11px] font-mono text-amber-700 bg-amber-50 px-2 py-0.5 rounded border border-amber-200">
                      Demo Environment
                    </span>
                    <span className="hidden md:inline-block text-[11px] font-mono text-slate-600 bg-slate-100 px-2 py-0.5 rounded border border-slate-200">
                      Synthetic Data
                    </span>
                  </div>
                  <p className="text-xs text-[#6B6B6B]">
                    Voice-first AI for coordinating everyday hospital workflows. Strictly non-clinical.
                  </p>
                </div>
              </div>

              {/* Center Navigation Tabs */}
              <nav aria-label="Workspace Views" className="flex flex-wrap items-center gap-1 bg-[#F5F3F0] p-1 rounded-lg border border-[#E8E4DF]">
                {[
                  { id: "overview", label: "Command Center", icon: "fa-compass" },
                  { id: "operations", label: "Operations", icon: "fa-hospital" },
                  { id: "tasks", label: `Tasks (${pendingTasksCount})`, icon: "fa-list-check" },
                  { id: "calls", label: `Calls (${callsTodayCount})`, icon: "fa-phone-volume" },
                  { id: "inventory", label: `Inventory (${invReqsCount})`, icon: "fa-boxes-stacked" },
                  { id: "followups", label: `Follow-ups (${followupsCount})`, icon: "fa-clipboard-user" },
                  { id: "devices", label: "Devices (ESP32)", icon: "fa-microchip" },
                  { id: "integrations", label: "Architecture", icon: "fa-diagram-project" },
                  { id: "audit", label: `Audit (${auditLogs.length})`, icon: "fa-shield-halved" }
                ].map((tab) => (
                  <button
                    key={tab.id}
                    onClick={() => {
                      setActiveTab(tab.id);
                      fetchAllHospitalData();
                    }}
                    className={`serif-focus px-2.5 py-1.5 rounded-md text-xs font-medium transition-all duration-150 flex items-center space-x-1.5 ${
                      activeTab === tab.id
                        ? "bg-white text-[#1A1A1A] shadow-sm border border-[#B8860B]/40 font-semibold"
                        : "text-[#6B6B6B] hover:text-[#1A1A1A]"
                    }`}>
                    <i className={`fa-solid ${tab.icon} ${activeTab === tab.id ? "text-[#B8860B]" : "text-[#6B6B6B]"}`}></i>
                    <span>{tab.label}</span>
                  </button>
                ))}
              </nav>

              {/* Right Controls: Role Switcher & Voice HUD Launch */}
              <div className="flex items-center space-x-2">
                {/* Role Switcher Dropdown */}
                <div className="flex items-center space-x-1 bg-[#F5F3F0] px-2 py-1 rounded-md border border-[#E8E4DF]">
                  <span className="text-[11px] font-mono text-[#6B6B6B]">Role:</span>
                  <select
                    value={userRole}
                    onChange={(e) => setUserRole(e.target.value)}
                    className="bg-transparent text-xs font-semibold text-[#1A1A1A] focus:outline-none cursor-pointer">
                    <option value="Doctor">Doctor (Dr. Arvind Rao)</option>
                    <option value="Nurse">Nurse (Staff Nurse Priya)</option>
                    <option value="Administrator">Administrator (Sunil Sharma)</option>
                    <option value="Operations">Operations (Kavita Nair)</option>
                    <option value="IT / Biomedical">IT / Biomedical (Vikram Joshi)</option>
                    <option value="Reception">Reception (Deepa Rao)</option>
                  </select>
                </div>

                {/* Quick Call Dept Button */}
                <SerifButton
                  variant="outline"
                  size="xs"
                  onClick={() => {
                    setSelectedCallDept("Biomedical Engineering");
                    setCallPurpose("Inquire regarding pending maintenance request");
                    setCallModalOpen(true);
                  }}
                  title="Directly trigger outbound CALL-E voice call">
                  <i className="fa-solid fa-phone-volume text-[#B8860B] mr-1.5"></i>
                  <span>Call Dept</span>
                </SerifButton>

                {/* Voice Audio Mute Toggle */}
                <SerifButton
                  variant="outline"
                  size="xs"
                  active={voiceEnabled}
                  onClick={() => {
                    const next = !voiceEnabled;
                    setVoiceEnabled(next);
                    if (!next) stopSpeaking();
                  }}>
                  <i className={`fa-solid ${voiceEnabled ? "fa-volume-high text-[#B8860B]" : "fa-volume-xmark"} mr-1.5`}></i>
                  <span>Voice: {voiceEnabled ? "ON" : "MUTED"}</span>
                </SerifButton>

                {/* Fullscreen Voice HUD */}
                <SerifButton
                  variant="primary"
                  size="xs"
                  onClick={() => {
                    unlockAudioEngine();
                    setVoiceModeOpen(true);
                    voiceModeOpenRef.current = true;
                    if (!hasGreetedRef.current) {
                      hasGreetedRef.current = true;
                      speakImmediate(`HospiOne voice operations active for ${userRole}. How can I assist with your hospital workflow today?`);
                    } else if (!isListening && !isSpeaking) {
                      startListeningSession();
                    }
                  }}>
                  <i className="fa-solid fa-microphone-lines mr-1.5"></i>
                  <span>Voice HUD</span>
                </SerifButton>
              </div>
            </div>
          </header>

          {/* =====================================================================
              2. 5-CARD LIVE HOSPITAL KPI SUMMARY BAR
             ===================================================================== */}
          <section aria-label="Hospital Operational Summary Metrics" className="border-b border-[#E8E4DF] bg-[#F5F3F0]/70 px-4 sm:px-6 py-3">
            <div className="max-w-[1440px] mx-auto grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
              
              {/* Card 1: Pending Tasks */}
              <div
                onClick={() => setActiveTab("tasks")}
                className="bg-white border border-[#E8E4DF] rounded-lg px-4 py-2.5 shadow-sm hover:border-[#B8860B] cursor-pointer transition-all flex items-center justify-between">
                <div>
                  <span className="small-caps text-[#6B6B6B]">Pending Tasks</span>
                  <p className="font-display text-2xl font-bold text-[#1A1A1A] mt-0.5">
                    {pendingTasksCount} Tasks
                  </p>
                  <p className="text-[11px] text-[#6B6B6B]">
                    4 Maintenance • 3 Logistics
                  </p>
                </div>
                <div className="w-9 h-9 rounded-full bg-[#F5F3F0] border border-[#E8E4DF] flex items-center justify-center text-[#B8860B] shrink-0">
                  <i className="fa-solid fa-list-check text-sm"></i>
                </div>
              </div>

              {/* Card 2: Today's Calls */}
              <div
                onClick={() => setActiveTab("calls")}
                className="bg-white border border-[#E8E4DF] rounded-lg px-4 py-2.5 shadow-sm hover:border-[#B8860B] cursor-pointer transition-all flex items-center justify-between">
                <div>
                  <span className="small-caps text-[#6B6B6B]">Today's Calls</span>
                  <p className="font-display text-2xl font-bold text-[#1A1A1A] mt-0.5">
                    {callsTodayCount} Calls
                  </p>
                  <p className="text-[11px] text-[#6B6B6B]">
                    CALL-E Outbound Voice
                  </p>
                </div>
                <div className="w-9 h-9 rounded-full bg-[#F5F3F0] border border-[#E8E4DF] flex items-center justify-center text-[#B8860B] shrink-0">
                  <i className="fa-solid fa-phone-volume text-sm"></i>
                </div>
              </div>

              {/* Card 3: Inventory Requests */}
              <div
                onClick={() => setActiveTab("inventory")}
                className="bg-white border border-[#E8E4DF] rounded-lg px-4 py-2.5 shadow-sm hover:border-[#B8860B] cursor-pointer transition-all flex items-center justify-between">
                <div>
                  <span className="small-caps text-[#6B6B6B]">Inventory Requests</span>
                  <p className="font-display text-2xl font-bold text-[#B8860B] mt-0.5">
                    {invReqsCount} Pending
                  </p>
                  <p className="text-[11px] text-[#6B6B6B]">
                    2 Urgent: Gloves, Saline
                  </p>
                </div>
                <div className="w-9 h-9 rounded-full bg-[rgba(184,134,11,0.1)] border border-[#B8860B]/30 flex items-center justify-center text-[#B8860B] shrink-0">
                  <i className="fa-solid fa-boxes-stacked text-sm"></i>
                </div>
              </div>

              {/* Card 4: Follow-ups Due */}
              <div
                onClick={() => setActiveTab("followups")}
                className="bg-white border border-[#E8E4DF] rounded-lg px-4 py-2.5 shadow-sm hover:border-[#B8860B] cursor-pointer transition-all flex items-center justify-between">
                <div>
                  <span className="small-caps text-[#6B6B6B]">Follow-ups Due</span>
                  <p className="font-display text-2xl font-bold text-[#1A1A1A] mt-0.5">
                    {followupsCount} Today
                  </p>
                  <p className="text-[11px] text-[#6B6B6B]">
                    Non-Clinical Administration
                  </p>
                </div>
                <div className="w-9 h-9 rounded-full bg-[#F5F3F0] border border-[#E8E4DF] flex items-center justify-center text-[#B8860B] shrink-0">
                  <i className="fa-solid fa-clipboard-user text-sm"></i>
                </div>
              </div>

              {/* Card 5: Fleet Devices */}
              <div
                onClick={() => setActiveTab("devices")}

                </div>
              </div>
            </div>
          )}

          {/* NEW REQUISITION MODAL */}
          {newReqModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
              <div className="bg-white rounded-lg border border-[#E8E4DF] shadow-xl max-w-md w-full p-6 space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-[#E8E4DF]">
                  <h3 className="font-display font-semibold text-lg text-[#1A1A1A]">New Supply Requisition</h3>
                  <button onClick={() => setNewReqModalOpen(false)} className="text-[#6B6B6B] hover:text-[#1A1A1A]">✕</button>
                </div>
                <div className="space-y-3 text-xs">
                  <div>
                    <label className="font-semibold text-[#1A1A1A] block mb-1">Item Name</label>
                    <input
                      type="text"
                      value={newReqData.item_name}
                      onChange={(e) => setNewReqData({ ...newReqData, item_name: e.target.value })}
                      className="w-full h-10 px-3 rounded border border-[#E8E4DF] text-xs"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="font-semibold text-[#1A1A1A] block mb-1">Quantity</label>
                      <input
                        type="number"
                        value={newReqData.quantity}
                        onChange={(e) => setNewReqData({ ...newReqData, quantity: parseInt(e.target.value) || 1 })}
                        className="w-full h-10 px-3 rounded border border-[#E8E4DF] text-xs"
                      />
                    </div>
                    <div>
                      <label className="font-semibold text-[#1A1A1A] block mb-1">Unit</label>
                      <input
                        type="text"
                        value={newReqData.unit}
                        onChange={(e) => setNewReqData({ ...newReqData, unit: e.target.value })}
                        className="w-full h-10 px-3 rounded border border-[#E8E4DF] text-xs"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="font-semibold text-[#1A1A1A] block mb-1">Department</label>
                    <select
                      value={newReqData.department}
                      onChange={(e) => setNewReqData({ ...newReqData, department: e.target.value })}
                      className="w-full h-10 px-2 rounded border border-[#E8E4DF] bg-white text-xs">
                      {departments.map((d, i) => (
                        <option key={i} value={d.name}>{d.name}</option>
                      ))}
                    </select>
                  </div>
                </div>
                <div className="flex items-center justify-end gap-2 pt-2 border-t border-[#E8E4DF]">
                  <SerifButton variant="outline" size="sm" onClick={() => setNewReqModalOpen(false)}>Cancel</SerifButton>
                  <SerifButton
                    variant="primary"
                    size="sm"
                    onClick={async () => {
                      await fetch("/api/hospital/inventory/requests", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                          ...newReqData,
                          requested_by: `${userRole} (HospiOne Portal)`
                        })
                      });
                      playChime("ack");
                      setNewReqModalOpen(false);
                      fetchAllHospitalData();
                    }}>
                    <span>Submit Requisition</span>
                  </SerifButton>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { error: null }; }
      static getDerivedStateFromError(error) { return { error }; }
      componentDidCatch(error, info) { console.error("[HospiOne UI Error]", error, info); }
      render() {
        if (this.state.error) {
          return (
            <div style={{ padding: 32, fontFamily: "sans-serif" }}>
              <h2 style={{ color: "#B8860B" }}>HospiOne hit a display error</h2>
              <pre style={{ whiteSpace: "pre-wrap", color: "#6B6B6B", fontSize: 12 }}>{String(this.state.error && this.state.error.message)}</pre>
              <button onClick={() => this.setState({ error: null })} style={{ marginRight: 8, padding: "6px 14px" }}>Try again</button>
              <button onClick={() => window.location.reload()} style={{ padding: "6px 14px" }}>Reload page</button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
