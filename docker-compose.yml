version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: operator-postgres
    environment:
      POSTGRES_USER: operator
      POSTGRES_PASSWORD: operator_password
      POSTGRES_DB: operator_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operator -d operator_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  trueforge:
    image: node:22-alpine
    container_name: operator-trueforge
    working_dir: /app
    command: sh -c "npx -y @truefoundry/trueforge@latest --port 8790"
    ports:
      - "8790:8790"
    environment:
      - PORT=8790
      - PUBLIC_BASE_URL=http://localhost:8790

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: operator-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: operator-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://operator:operator_password@postgres:5432/operator_db
      - TRUEFORGE_BASE_URL=http://trueforge:8790
      - N8N_BASE_URL=http://n8n:5678
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  n8n_data:
